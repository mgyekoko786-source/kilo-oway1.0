<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#071827">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Kilo Oway</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">

            <div class="app-icon">
                🚕
            </div>

            <div>
                <div class="brand-name">Kilo Oway</div>
                <div class="brand-sub">Myanmar Oway Kilometer Meter</div>
            </div>

        </div>

        <div class="header-actions">

            <button class="icon-btn" id="historyBtn" aria-label="History">
                ◷
            </button>

            <button class="icon-btn" id="settingsBtn" aria-label="Settings">
                ⚙
            </button>

        </div>

    </header>


    <!-- MAIN FARE CARD -->
    <section class="fare-card">

        <div class="city-glow"></div>

        <div class="fare-content">

            <div class="small-title">
                စုစုပေါင်းကျသင့်ငွေ
            </div>

            <div class="fare-row">

                <span id="totalFare">3,000</span>
