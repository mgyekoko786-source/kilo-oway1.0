<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE66A"/><stop offset=".45" stop-color="#FFD21C"/><stop offset="1" stop-color="#D99D00"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#294C60"/><stop offset="1" stop-color="#081B28"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5C6971"/><stop offset=".5" stop-color="#202A31"/><stop offset="1" stop-color="#0C1217"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".38"/></filter>
</defs>
<g filter="url(#shadow)">
  <!-- mirrors -->
  <path d="M105 142 L45 111 Q29 104 25 119 L22 145 Q21 159 39 157 L105 153Z" fill="url(#metal)" stroke="#111820" stroke-width="7"/>
  <path d="M407 142 L467 111 Q483 104 487 119 L490 145 Q491 159 473 157 L407 153Z" fill="url(#metal)" stroke="#111820" stroke-width="7"/>
  <!-- roof -->
  <path d="M143 94 Q256 45 369 94 L393 118 L119 118Z" fill="url(#body)" stroke="#171D21" stroke-width="9"/>
  <!-- main shell -->
  <path d="M93 137 Q256 103 419 137 L447 311 Q451 341 421 361 L91 361 Q61 341 65 311Z" fill="url(#body)" stroke="#171D21" stroke-width="10"/>
  <!-- windshield -->
  <path d="M121 144 Q256 117 391 144 L375 247 L137 247Z" fill="url(#glass)" stroke="#141C21" stroke-width="9"/>
  <!-- windshield reflection -->
  <path d="M151 151 L225 135 L174 239 L139 239Z" fill="#BDE6F2" opacity=".15"/>
  <!-- single wiper -->
  <path d="M256 231 L333 158" stroke="#111820" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="231" r="8" fill="#111820"/>
  <!-- front fascia -->
  <path d="M103 257 Q256 278 409 257 L430 333 Q432 347 414 350 L98 350 Q80 347 82 333Z" fill="#222B30"/>
  <!-- headlight -->
  <circle cx="256" cy="308" r="34" fill="#FFF7B0" stroke="#161C20" stroke-width="9"/>
  <circle cx="256" cy="308" r="17" fill="#FFFFFF"/>
  <!-- indicators -->
  <ellipse cx="125" cy="304" rx="19" ry="13" fill="#FFB300" stroke="#14191D" stroke-width="6"/>
  <ellipse cx="387" cy="304" rx="19" ry="13" fill="#FFB300" stroke="#14191D" stroke-width="6"/>
  <!-- bumper -->
  <path d="M112 356 Q256 374 400 356" fill="none" stroke="#0E1418" stroke-width="14" stroke-linecap="round"/>
  <!-- wheel -->
  <circle cx="256" cy="405" r="57" fill="#10161A" stroke="#4D5A61" stroke-width="9"/>
  <circle cx="256" cy="405" r="28" fill="#737F84"/>
  <circle cx="256" cy="405" r="11" fill="#20272C"/>
  <!-- side lower wheels hints -->
  <ellipse cx="104" cy="356" rx="31" ry="19" fill="#0B1014"/>
  <ellipse cx="408" cy="356" rx="31" ry="19" fill="#0B1014"/>
</g>
</svg>